name: Taste Post Activity Comments
on:
  push:
    paths:
      - '.github/workflows/taste-post-activity-comments.yml'
      - '.github/scripts/taste-post-activity-comments.py'
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply native social interaction patch
        run: python .github/scripts/taste-post-activity-comments.py
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir /tmp/pellix-android-export
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir /tmp/pellix-ios-export
      - name: Commit native patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/client.js src/components/SocialCommentsModal.js src/components/SocialFeedCard.js src/screens/DetailScreen.js
          git commit -m "Taste Post paylaşımını ve aktivite yorumlarını tamamla"
          git push
