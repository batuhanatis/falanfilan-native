name: Apply profile cleanup and recommendation modal scroll fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-modal-cleanup-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout UX branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          fetch-depth: 0

      - name: Patch modal scrolling and profile hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) IslandModal: the ScrollView previously expanded to its full content height inside
          # a max-height card, so the parent clipped it rather than giving the ScrollView a
          # constrained viewport. flexShrink/minHeight makes overflow genuinely scrollable.
          island = Path('src/components/IslandModal.js')
          s = island.read_text()
          s = s.replace('''                keyboardShouldPersistTaps="handled"\n                keyboardDismissMode="interactive"\n              >''', '''                keyboardShouldPersistTaps="handled"\n                keyboardDismissMode="interactive"\n                nestedScrollEnabled\n              >''', 1)
          s = s.replace('''      maxHeight: "84%",''', '''      maxHeight: "88%",''', 1)
          s = s.replace('''    body: { flexGrow: 0 },''', '''    body: { flexShrink: 1, minHeight: 0 },''', 1)
          if 'body: { flexShrink: 1, minHeight: 0 }' not in s or 'nestedScrollEnabled' not in s:
              raise SystemExit('IslandModal scroll patch did not apply')
          island.write_text(s)

          # 2) Profile: weekly quests already have a prominent home destination and badges
          # already live in Settings. Remove the two large retention cards from Profile so the
          # page stays focused on identity, Taste DNA and content.
          profile = Path('src/screens/ProfileScreen.js')
          p = profile.read_text()
          p = p.replace('''  Eye, EyeOff, Sparkles, Trophy, Flame,\n''', '''  Eye, EyeOff, Sparkles,\n''', 1)
          p = p.replace('''  const [questSummary, setQuestSummary] = useState(null);\n  const [achievements, setAchievements] = useState(null);\n''', '', 1)
          p = p.replace('''    api.quests(auth.token).then((data) => {\n      setQuestStreak(data.streak || 0);\n      setQuestSummary(data);\n    }).catch(() => {});\n    api.achievements(auth.token).then(setAchievements).catch(() => {});\n''', '''    api.quests(auth.token).then((data) => setQuestStreak(data.streak || 0)).catch(() => {});\n''', 1)
          p = p.replace('''  const questTotal = questSummary?.quests?.length || 0;\n  const questCompleted = questSummary?.quests?.filter((q) => q.completed).length || 0;\n  const questPercent = questTotal ? Math.round((questCompleted / questTotal) * 100) : 0;\n  const unlockedBadges = (achievements?.badges || []).filter((badge) => badge.unlocked).slice(0, 3);\n''', '', 1)

          start = p.find('''        <View style={styles.retentionRow}>\n''')
          end_marker = '''        {!premiumStatus?.isPremium && (\n'''
          end = p.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Profile retention block anchors not found')
          p = p[:start] + '''        {/* Haftalık görevler Ana Sayfa'daki haftalık hedef alanında; rozetler Ayarlar > Rozetler'de.\n            Profil, kimlik + Zevk DNA + içerik odağında daha kompakt tutuluyor. */}\n\n''' + p[end:]

          # Verify the large profile cards are gone and settings route remains the badge home elsewhere.
          if 'Rozet Vitrini' in p or 'Bu Haftaki Hedefin' in p:
              raise SystemExit('Large retention cards still present in Profile')
          if 'setAchievements' in p or 'questSummary' in p:
              raise SystemExit('Unused profile retention state still present')
          profile.write_text(p)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate iOS and Android JS bundles
        run: |
          npx expo export --platform ios --output-dir /tmp/pellix-ios-export
          npx expo export --platform android --output-dir /tmp/pellix-android-export

      - name: Commit UX changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/IslandModal.js src/screens/ProfileScreen.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix recommendation modal scroll and simplify profile"
          git push origin HEAD:ux-retention-v1
