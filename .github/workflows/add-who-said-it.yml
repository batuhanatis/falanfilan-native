name: Add Who Said It Native

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-who-said-it.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Who Said It to Pellix Play
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          component = base64.b64decode("").decode("utf-8")

          api = Path('src/api/play.js')
          p = api.read_text()
          if 'whoSaidIt:' not in p:
              anchor = '  blindPick: (token) => playRequest("/api/play/blind-pick", token),\n'
              if anchor not in p:
                  raise SystemExit('play.js blindPick anchor bulunamadı')
              p = p.replace(anchor, '  whoSaidIt: (token) => playRequest("/api/play/who-said-it", token),\n  answerWhoSaidIt: (token, questionId, chosen) => playRequest("/api/play/who-said-it/answer", token, { method: "POST", body: { questionId, chosen } }),\n' + anchor, 1)
          api.write_text(p)

          screen = Path('src/screens/PellixPlayScreen.js')
          s = screen.read_text()
          old_import = 'import { ChevronLeft, Swords, Users, EyeOff, RotateCcw, ArrowRight, Check, X } from "lucide-react-native";'
          new_import = 'import { ChevronLeft, Swords, Users, EyeOff, Quote, RotateCcw, ArrowRight, Check, X } from "lucide-react-native";'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          elif 'Quote,' not in s and ' Quote ' not in s:
              raise SystemExit('lucide import anchor bulunamadı')

          if 'who_said_it:' not in s:
              anchor = '  blind_pick: { title: "Blind Pick", subtitle: "İsim ve poster yok. Sadece ipuçları.", icon: EyeOff },\n'
              if anchor not in s:
                  raise SystemExit('GAME_META anchor bulunamadı')
              s = s.replace(anchor, anchor + '  who_said_it: { title: "Who Said It?", subtitle: "İkonik repliği hangi karakter söyledi?", icon: Quote },\n', 1)

          if 'activeGame === "who_said_it"' not in s:
              anchor = '      ) : activeGame === "blind_pick" ? (\n        <BlindPick token={auth.token} styles={styles} c={c} onDisabled={() => { setActiveGame(null); refreshFeatures(); }} />\n      ) : ('
              replacement = '      ) : activeGame === "blind_pick" ? (\n        <BlindPick token={auth.token} styles={styles} c={c} onDisabled={() => { setActiveGame(null); refreshFeatures(); }} />\n      ) : activeGame === "who_said_it" ? (\n        <WhoSaidIt token={auth.token} styles={styles} c={c} onDisabled={() => { setActiveGame(null); refreshFeatures(); }} />\n      ) : ('
              if anchor not in s:
                  raise SystemExit('activeGame anchor bulunamadı')
              s = s.replace(anchor, replacement, 1)

          if 'function WhoSaidIt(' not in s:
              anchor = 'function BlindPick({ token, styles, c, onDisabled }) {'
              if anchor not in s:
                  raise SystemExit('BlindPick component anchor bulunamadı')
              s = s.replace(anchor, component + anchor, 1)
          screen.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate Android export
        run: npx expo export --platform android --output-dir dist-who-said-it-android

      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir dist-who-said-it-ios

      - name: Commit changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/play.js src/screens/PellixPlayScreen.js
          git rm .github/workflows/add-who-said-it.yml
          git commit -m "Who Said It oyununu Pellix Play'e ekle"
          git push
