name: Search Dropdown Scroll Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-dropdown-scroll-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make search dropdown vertically scrollable
        run: python -c "from pathlib import Path; import base64; p=Path('src/screens/HomeScreen.js'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'Beklenen dropdown render bloğu bulunamadı'; s=s.replace(old,new,1); style='    dropdownOverlay: { position: \"absolute\", left: 16, right: 16, marginTop: 0, zIndex: 50, elevation: 20 },\n'; assert style in s, 'dropdownOverlay bulunamadı'; p.write_text(s.replace(style, style+'    dropdownList: { maxHeight: 420 },\n',1))"
      - name: Install dependencies
        run: npm ci
      - name: Validate Expo iOS export
        run: npx expo export --platform ios --output-dir dist-search-dropdown-validation
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/HomeScreen.js
          git commit -m "Arama sonuç dropdown listesini kaydırılabilir yap"
          git push
