name: Chat Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-validation.yml'
      - 'src/utils/chatDb.js'
      - 'src/utils/chatMessagesPrefetch.js'
      - 'src/api/client.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist-chat-validation
