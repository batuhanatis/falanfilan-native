name: Apply full Taste DNA profile and publish production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-full-taste-dna-temp.yml'

permissions:
  contents: write

jobs:
  apply-and-publish:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_BASE: https://api.pellix.app

    steps:
      - name: Checkout production UX branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          fetch-depth: 0

      - name: Patch profile Taste DNA to use full server aggregate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client_path = Path('src/api/client.js')
          client = client_path.read_text()
          old = '  me: (token) => request("/api/me", { token }),\n'
          new = old + '  tasteDNA: (token) => request("/api/me/taste-dna", { token }),\n'
          if 'tasteDNA: (token) => request("/api/me/taste-dna"' not in client:
              if old not in client:
                  raise SystemExit('client.js me marker not found')
              client = client.replace(old, new, 1)
              client_path.write_text(client)

          profile_path = Path('src/screens/ProfileScreen.js')
          text = profile_path.read_text()

          old = '  const [diaryEntries, setDiaryEntries] = useState([]);\n'
          new = old + '  const [serverTasteDNA, setServerTasteDNA] = useState(null);\n'
          if 'const [serverTasteDNA, setServerTasteDNA]' not in text:
              if old not in text:
                  raise SystemExit('Profile state marker not found')
              text = text.replace(old, new, 1)

          old = '    diaryApi.stats(auth.token).then(setDiaryStats).catch(() => setDiaryStats(null));\n    diaryApi.list(auth.token, { page: 1, limit: 50 }).then((data) => setDiaryEntries(data.results || [])).catch(() => setDiaryEntries([]));\n'
          new = '    diaryApi.stats(auth.token).then(setDiaryStats).catch(() => setDiaryStats(null));\n    api.tasteDNA(auth.token).then(setServerTasteDNA).catch(() => setServerTasteDNA(null));\n    diaryApi.list(auth.token, { page: 1, limit: 50 }).then((data) => setDiaryEntries(data.results || [])).catch(() => setDiaryEntries([]));\n'
          if 'api.tasteDNA(auth.token).then(setServerTasteDNA)' not in text:
              if old not in text:
                  raise SystemExit('Profile load marker not found')
              text = text.replace(old, new, 1)

          old = '  const tasteDNA = useMemo(() => buildTasteDNA(likedMovies, profile, diaryEntries), [likedMovies, profile, diaryEntries]);\n'
          new = '  const localTasteDNA = useMemo(() => buildTasteDNA(likedMovies, profile, diaryEntries), [likedMovies, profile, diaryEntries]);\n  const tasteDNA = serverTasteDNA || localTasteDNA;\n'
          if 'const tasteDNA = serverTasteDNA || localTasteDNA;' not in text:
              if old not in text:
                  raise SystemExit('Profile tasteDNA marker not found')
              text = text.replace(old, new, 1)

          old = '''        {/* Profil artık yalnızca sayaçlardan oluşmuyor; kullanıcının seçimlerinden oluşan yaşayan\n            bir kimlik gösteriyor. Bu ilk Taste DNA sürümü tamamen mevcut veriden türetiliyor,\n            yeni backend endpoint'i gerektirmiyor. */}'''
          new = '''        {/* Zevk DNA artık backend'de kullanıcının TÜM like/dislike + tüm puan geçmişinden\n            hesaplanıyor. Bu ekranda yalnız aggregate sonuç gösteriliyor; profil özetindeki 30\n            içerik ve Diary'nin ilk sayfası artık DNA hesabını sınırlamıyor. */}'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '<View style={[styles.genreDNAFill, { width: `${Math.min(100, genre.percent * 2.1)}%` }]} />'
          new = '<View style={[styles.genreDNAFill, { width: `${Math.min(100, genre.strength ?? genre.percent * 2.1)}%` }]} />'
          if old in text:
              text = text.replace(old, new, 1)

          profile_path.write_text(text)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source patch
        run: |
          git diff --check
          grep -q 'tasteDNA: (token) => request("/api/me/taste-dna"' src/api/client.js
          grep -q 'const tasteDNA = serverTasteDNA || localTasteDNA' src/screens/ProfileScreen.js

      - name: Validate iOS JS bundle
        run: npx expo export --platform ios --output-dir /tmp/pellix-taste-dna-ios

      - name: Validate Android JS bundle
        run: npx expo export --platform android --output-dir /tmp/pellix-taste-dna-android

      - name: Commit approved UX change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/client.js src/screens/ProfileScreen.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Use complete history for profile Taste DNA"
            git push origin HEAD:ux-retention-v1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify production target
        run: |
          test "$EXPO_PUBLIC_API_BASE" = "https://api.pellix.app"
          node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync("eas.json","utf8")); if(e.build?.production?.channel!=="production") process.exit(1)'

      - name: Publish production OTA
        run: >-
          eas update --channel production --platform all --environment production --non-interactive
          --message "Use complete history for profile Taste DNA"
