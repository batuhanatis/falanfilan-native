name: Search Dropdown Scroll Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-dropdown-scroll-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make search dropdown vertically scrollable
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/HomeScreen.js')
          s = p.read_text()
          old = '''          ) : (
            <View>
              {dropdownResults.map((m) => (
                <TouchableOpacity key={m.id} style={styles.dropdownRow} onPress={() => selectSearchResult(m)} activeOpacity={0.7}>
                  {m.poster ? (
                    <Image source={{ uri: m.poster }} style={styles.dropdownPoster} />
                  ) : (
                    <View style={[styles.dropdownPoster, { backgroundColor: c.surface2 }]} />
                  )}
                  <View style={{ flex: 1, minWidth: 0 }}>
                    <Text style={styles.dropdownTitle} numberOfLines={1}>{m.title}</Text>
                    <Text style={styles.dropdownMeta} numberOfLines={1}>{m.year} · {m.type}</Text>
                  </View>
                  <View style={styles.dropdownRating}>
                    <Star size={10} color={c.accent} fill={c.accent} />
                    <Text style={styles.dropdownRatingText}>{m.imdb}</Text>
                  </View>
                </TouchableOpacity>
              ))}
            </View>
          )}'''
          new = '''          ) : (
            <FlatList
              data={dropdownResults}
              keyExtractor={(m) => String(m.id)}
              style={styles.dropdownList}
              keyboardShouldPersistTaps="always"
              keyboardDismissMode="on-drag"
              nestedScrollEnabled
              showsVerticalScrollIndicator
              renderItem={({ item: m }) => (
                <TouchableOpacity style={styles.dropdownRow} onPress={() => selectSearchResult(m)} activeOpacity={0.7}>
                  {m.poster ? (
                    <Image source={{ uri: m.poster }} style={styles.dropdownPoster} />
                  ) : (
                    <View style={[styles.dropdownPoster, { backgroundColor: c.surface2 }]} />
                  )}
                  <View style={{ flex: 1, minWidth: 0 }}>
                    <Text style={styles.dropdownTitle} numberOfLines={1}>{m.title}</Text>
                    <Text style={styles.dropdownMeta} numberOfLines={1}>{m.year} · {m.type}</Text>
                  </View>
                  <View style={styles.dropdownRating}>
                    <Star size={10} color={c.accent} fill={c.accent} />
                    <Text style={styles.dropdownRatingText}>{m.imdb}</Text>
                  </View>
                </TouchableOpacity>
              )}
            />
          )}'''
          if old not in s:
              raise SystemExit('Beklenen dropdown render bloğu bulunamadı')
          s = s.replace(old, new, 1)
          style_old = '    dropdownOverlay: { position: "absolute", left: 16, right: 16, marginTop: 0, zIndex: 50, elevation: 20 },\n'
          style_new = style_old + '    dropdownList: { maxHeight: 420 },\n'
          if style_old not in s:
              raise SystemExit('Beklenen dropdownOverlay stili bulunamadı')
          p.write_text(s.replace(style_old, style_new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate Expo iOS export
        run: npx expo export --platform ios --output-dir dist-search-dropdown-validation
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/HomeScreen.js
          git commit -m "Arama sonuç dropdown listesini kaydırılabilir yap"
          git push
