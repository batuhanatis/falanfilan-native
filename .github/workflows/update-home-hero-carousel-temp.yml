name: Update Home hero carousel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-home-hero-carousel-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[home-hero-carousel]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main patch helper
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preserve patch helper
        run: cp .github/scripts/update-home-hero-carousel.py /tmp/update-home-hero-carousel.py

      - name: Checkout UX retention branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          fetch-depth: 1

      - name: Apply 10-card personalized hero carousel
        run: python /tmp/update-home-hero-carousel.py

      - name: Install dependencies
        run: npm ci

      - name: Validate iOS and Android JS bundles
        run: npx expo export --platform all --output-dir /tmp/pellix-home-hero-carousel

      - name: Commit hero carousel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/HomeScreenV2.js
          git diff --cached --check
          git commit -m "Add personalized 10-card Home hero carousel"
          git push origin HEAD:ux-retention-v1
