name: Upgrade Who Said It Native

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-who-said-it.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix upgrade script quoting
        run: node scripts/fix-who-said-it-upgrade.mjs
      - name: Apply native upgrade
        run: node scripts/upgrade-who-said-it.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir dist-who-said-it-upgrade-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir dist-who-said-it-upgrade-ios
      - name: Commit upgrade and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/play.js src/screens/PellixPlayScreen.js
          git rm -f scripts/upgrade-who-said-it.mjs scripts/fix-who-said-it-upgrade.mjs .github/workflows/upgrade-who-said-it.yml
          git commit -m "Who Said It filtrelerini ve günlük challenge akışını ekle"
          git push
