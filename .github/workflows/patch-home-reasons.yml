name: Patch personalized hero reasons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-home-reasons.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-home-reasons]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout UX retention branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          fetch-depth: 1

      - name: Rank hero with real taste signals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('src/screens/HomeScreenV2.js')
          text = home.read_text(encoding='utf-8')

          old_map_tail = '  }, [movies, likedMovies]);\n\n  const filteredList = useMemo(() => {'
          if text.count(old_map_tail) != 1:
              raise SystemExit('moviesById insertion point not found exactly once')
          new_map_tail = '''  }, [movies, likedMovies]);

  const tasteLikedMovies = useMemo(() => {
    const byId = new Map();
    likedMovies.forEach((movie) => {
      if (movie?.id != null) byId.set(Number(movie.id), movie);
    });
    liked.forEach((id) => {
      const movie = moviesById.get(id) || moviesById.get(Number(id));
      if (movie?.id != null) byId.set(Number(movie.id), movie);
    });
    return [...byId.values()];
  }, [likedMovies, liked, moviesById]);

  const filteredList = useMemo(() => {'''
          text = text.replace(old_map_tail, new_map_tail, 1)

          start_marker = '  const visibleList = describeResults ? describeResults.slice(0, describeCount) : filteredList;\n'
          end_marker = '  const gridList = heroMovie ? visibleList.filter((m) => m.id !== heroMovie.id) : visibleList;\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('hero block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('hero block end not found')
          end += len(end_marker)

          replacement = '''  const visibleList = describeResults ? describeResults.slice(0, describeCount) : filteredList;
  const recommendationContext = useMemo(() => ({
    preferredGenres,
    genreFilter,
    typeFilter,
    shortOnly,
    platformFilters: [...platformFilters],
    yearFilters: [...yearFilters],
    aiLabel: describeResults ? aiResultsLabel : null,
  }), [preferredGenres, genreFilter, typeFilter, shortOnly, platformFilters, yearFilters, describeResults, aiResultsLabel]);

  const heroSelection = useMemo(() => {
    const candidates = visibleList.filter((movie) => !disliked.has(movie.id)).slice(0, 24);
    const pool = candidates.length ? candidates : visibleList.slice(0, 24);
    if (!pool.length) return { movie: null, reasons: [], score: -Infinity };

    let best = null;
    pool.forEach((movie, index) => {
      const reasons = recommendationReasons(movie, tasteLikedMovies, recommendationContext);
      const personalized = reasons.filter((reason) => reason.personalized);
      const score = personalized.length
        ? personalized.slice(0, 4).reduce(
            (sum, reason, reasonIndex) => sum + reason.score * (1 - reasonIndex * 0.12),
            0,
          ) + personalized.length * 6 - index * 0.05
        : -index;

      if (!best || score > best.score) best = { movie, reasons, score };
    });

    return best || { movie: pool[0], reasons: [], score: 0 };
  }, [visibleList, disliked, tasteLikedMovies, recommendationContext]);

  const heroMovie = heroSelection.movie;
  const heroReasons = heroSelection.reasons;
  const heroReason = heroReasons.find((reason) => reason.personalized)?.short || heroReasons[0]?.short || null;
  const gridList = heroMovie ? visibleList.filter((m) => m.id !== heroMovie.id) : visibleList;
'''
          text = text[:start] + replacement + text[end:]
          home.write_text(text, encoding='utf-8')

          recommend = Path('src/utils/recommend.js')
          rec_text = recommend.read_text(encoding='utf-8')
          rec_text = rec_text.replace('Bildigimiz beğenilerinin', 'Bildiğimiz beğenilerinin')
          recommend.write_text(rec_text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate Android JS bundle
        run: npx expo export --platform android --output-dir /tmp/pellix-export

      - name: Commit patch to UX branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/HomeScreenV2.js src/utils/recommend.js
          git diff --cached --check
          git commit -m "Rank hero by personalized taste signals"
          git push origin HEAD:ux-retention-v1
