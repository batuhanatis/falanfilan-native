name: Fix Discover TV Filter
on:
  push:
    paths:
      - '.github/workflows/fix-discover-tv-filter.yml'
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix TV filter queue source
        run: >-
          python -c "from pathlib import Path; p=Path('src/screens/DiscoverScreen.js'); s=p.read_text(); old='        const type = Math.random() < 0.55 ? \\"movie\\" : \\"tv\\";'; new='        const type = existingFilter === \\"Movie\\" ? \\"movie\\" : existingFilter === \\"TV Shows\\" ? \\"tv\\" : (Math.random() < 0.55 ? \\"movie\\" : \\"tv\\");'; assert old in s, 'type source anchor missing'; s=s.replace(old,new,1); old2='          const items = (data.results || []).filter((m) => !usedIds.has(m.id) && localMatchesType(m));'; new2='          const items = (data.results || []).filter((m) => !usedIds.has(m.id)).map((m) => existingFilter === \\"Movie\\" ? { ...m, type: \\"Film\\" } : existingFilter === \\"TV Shows\\" ? { ...m, type: \\"Dizi\\" } : m).filter((m) => localMatchesType(m));'; assert old2 in s, 'item filter anchor missing'; p.write_text(s.replace(old2,new2,1))"
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir /tmp/pellix-tv-filter-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir /tmp/pellix-tv-filter-ios
      - name: Validate diff
        run: git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-discover-tv-filter.yml
          git add src/screens/DiscoverScreen.js .github/workflows/fix-discover-tv-filter.yml
          git commit -m "Keşfet dizi filtresini düzelt"
          git push
