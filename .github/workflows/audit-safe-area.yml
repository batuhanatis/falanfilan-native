name: Audit Safe Area

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-safe-area.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit bottom sheets and fixed bottom controls
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path('src').rglob('*.js')):
              s = p.read_text(errors='ignore')
              signals = []
              if 'DismissableSheet' in s: signals.append('DismissableSheet')
              if 'justifyContent: "flex-end"' in s or "justifyContent: 'flex-end'" in s: signals.append('bottom-overlay')
              if 'position: "absolute"' in s and 'bottom:' in s: signals.append('absolute-bottom')
              if 'footer:' in s: signals.append('footer')
              if not signals: continue
              safe = 'useSafeAreaInsets' in s or 'SafeAreaView' in s
              print(f'{p}: safe={safe} signals={",".join(signals)}')
          PY
