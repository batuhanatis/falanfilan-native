name: Chat Menu Keyboard Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-menu-keyboard-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix long-press menu while keyboard is open
        run: python -c "from pathlib import Path; import base64; p=Path('src/screens/ChatConversationScreen.js'); s=p.read_text(); old=base64.b64decode('ICAgIG9wZW5NZW51OiAoaWQpID0+IHsKICAgICAgY29uc3QgaXRlbSA9IGxhdGVzdFJlZi5jdXJyZW50Lm1lc3NhZ2VzLmZpbmQoKG0pID0+IG0uaWQgPT09IGlkKTsKICAgICAgaWYgKGl0ZW0pIGxhdGVzdFJlZi5jdXJyZW50LnNldE1lbnVGb3IoaXRlbSk7CiAgICB9LA==').decode(); new=base64.b64decode('').decode(); assert old in s, 'Beklenen openMenu bloğu bulunamadı'; p.write_text(s.replace(old,new,1))"
      - name: Install dependencies
        run: npm ci
      - name: Validate Expo export
        run: npx expo export --platform ios --output-dir dist-chat-menu-validation
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/ChatConversationScreen.js
          git commit -m "Klavye açıkken chat mesaj menüsünü görünür tut"
          git push
