name: Patch personalized hero reasons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-home-reasons.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-home-reasons]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UX retention branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          fetch-depth: 1

      - name: Patch HomeScreenV2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/screens/HomeScreenV2.js')
          text = path.read_text(encoding='utf-8')

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          once(
              'import { recommendationReason } from "../utils/recommend";',
              'import { recommendationReason, recommendationReasons } from "../utils/recommend";',
              'recommend import'
          )
          once(
              'import HomeSkeleton from "../components/skeletons/HomeSkeleton";',
              'import HomeSkeleton from "../components/skeletons/HomeSkeleton";\nimport RecommendationWhyModal from "../components/RecommendationWhyModal";',
              'modal import'
          )

          once(
              '  const [liked, setLiked] = useState(new Set());',
              '  const [liked, setLiked] = useState(new Set());\n  const [likedMovies, setLikedMovies] = useState([]);\n  const [preferredGenres, setPreferredGenres] = useState([]);',
              'taste state'
          )
          once(
              '  const [pickerMovie, setPickerMovie] = useState(null);',
              '  const [pickerMovie, setPickerMovie] = useState(null);\n  const [showHeroReasons, setShowHeroReasons] = useState(false);',
              'reason modal state'
          )

          once(
              '      const data = await api.interactions(auth.token);',
              '      const [data, selfProfile, me] = await Promise.all([\n        api.interactions(auth.token),\n        api.userProfile(auth.token, auth.id).catch(() => ({ likedMovies: [] })),\n        api.me(auth.token).catch(() => ({ preferredGenres: [] })),\n      ]);',
              'interaction enrichment'
          )
          once(
              '      setLiked(nextLiked);',
              '      setLiked(nextLiked);\n      setLikedMovies(selfProfile.likedMovies || []);\n      setPreferredGenres(me.preferredGenres || []);',
              'taste setters'
          )
          once(
              '  }, [auth.token]);\n\n  const loadPage = useCallback',
              '  }, [auth.token, auth.id]);\n\n  const loadPage = useCallback',
              'loadInteractions deps'
          )

          once(
              '      await loadInteractions();\n      const first = await loadPage(1);',
              '      const [, first] = await Promise.all([loadInteractions(), loadPage(1)]);',
              'parallel initial load'
          )

          once(
              '  const moviesById = useMemo(() => new Map(movies.map((m) => [m.id, m])), [movies]);',
              '  const moviesById = useMemo(() => {\n    const map = new Map();\n    [...movies, ...likedMovies].forEach((m) => {\n      if (m?.id != null) map.set(m.id, m);\n    });\n    return map;\n  }, [movies, likedMovies]);',
              'movie map'
          )

          start_marker = '  const visibleList = describeResults ? describeResults.slice(0, describeCount) : filteredList;\n'
          end_marker = '  const gridList = heroMovie ? visibleList.filter((m) => m.id !== heroMovie.id) : visibleList;\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('hero block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('hero block end not found')
          end += len(end_marker)
          replacement = (
              '  const visibleList = describeResults ? describeResults.slice(0, describeCount) : filteredList;\n'
              '  const heroMovie = visibleList.find((m) => !disliked.has(m.id)) || visibleList[0] || null;\n'
              '  const heroReasons = useMemo(() => {\n'
              '    if (!heroMovie) return [];\n'
              '    return recommendationReasons(heroMovie, likedMovies, {\n'
              '      preferredGenres,\n'
              '      genreFilter,\n'
              '      typeFilter,\n'
              '      shortOnly,\n'
              '      platformFilters: [...platformFilters],\n'
              '      yearFilters: [...yearFilters],\n'
              '      aiLabel: describeResults ? aiResultsLabel : null,\n'
              '    });\n'
              '  }, [heroMovie, likedMovies, preferredGenres, genreFilter, typeFilter, shortOnly, platformFilters, yearFilters, describeResults, aiResultsLabel]);\n'
              '  const heroReason = heroReasons.find((reason) => reason.personalized)?.short || heroReasons[0]?.short || null;\n'
              '  const gridList = heroMovie ? visibleList.filter((m) => m.id !== heroMovie.id) : visibleList;\n'
          )
          text = text[:start] + replacement + text[end:]

          once(
              '            onLike={() => like(heroMovie.id)}\n            onPress={() => navigation.navigate("Detail", { movie: heroMovie })}',
              '            onLike={() => like(heroMovie.id)}\n            onWhy={() => setShowHeroReasons(true)}\n            onPress={() => navigation.navigate("Detail", { movie: heroMovie })}',
              'hero onWhy prop'
          )

          once(
              '      {sendMovie && <SendToFriendModal movie={sendMovie} onClose={() => setSendMovie(null)} />}',
              '      <RecommendationWhyModal\n        visible={showHeroReasons}\n        movie={heroMovie}\n        reasons={heroReasons}\n        onClose={() => setShowHeroReasons(false)}\n        onOpenDetail={() => {\n          setShowHeroReasons(false);\n          if (heroMovie) navigation.navigate("Detail", { movie: heroMovie });\n        }}\n      />\n      {sendMovie && <SendToFriendModal movie={sendMovie} onClose={() => setSendMovie(null)} />}',
              'reason modal render'
          )

          once(
              'function TonightHero({ movie, reason, liked, onLike, onPress, c }) {',
              'function TonightHero({ movie, reason, liked, onLike, onWhy, onPress, c }) {',
              'hero signature'
          )
          once(
              '<TouchableOpacity style={styles.heroPrimaryBtn} onPress={onPress}>',
              '<TouchableOpacity style={styles.heroPrimaryBtn} onPress={(e) => { e.stopPropagation?.(); onWhy?.(); }}>',
              'hero why button'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch to UX branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/HomeScreenV2.js
          git diff --cached --check
          git commit -m "Add personalized hero recommendation reasons"
          git push origin HEAD:ux-retention-v1
