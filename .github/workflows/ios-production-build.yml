name: iOS Local Production Build + Submit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-production-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: eas whoami

      - name: Build iOS production IPA locally on GitHub macOS
        run: eas build --platform ios --profile production --local --non-interactive --output ./pellix-production.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pellix-production-ipa
          path: pellix-production.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Submit IPA to App Store Connect
        run: eas submit --platform ios --profile production --path ./pellix-production.ipa --non-interactive --wait
