name: Apply social shortcut placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-social-shortcuts-main-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout UX branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          fetch-depth: 0

      - name: Move MatchParty and TasteMate under stories
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/ActivityScreen.js')
          s = p.read_text()
          s = s.replace(
          '''  // Sosyal ekran artık feature promosyonlarıyla başlamıyor. Önce story'ler ve gerçek arkadaş
          // içeriği geliyor; günlük soru 2. içerikten sonra, MatchParty/TasteMate kısayolları biraz daha
          // aşağıda feed'in doğal parçaları olarak görünüyor.
          ''',
          '''  // Günün sorusu feed'in doğal akışında kalıyor. MatchParty ve TasteMate ise keşfedilebilirliği
          // artırmak için story şeridinin hemen altında, sabit üst bölümde gösteriliyor.
          ''', 1)
          s = s.replace(
          '''    result.splice(Math.min(2, result.length), 0, { kind: "daily-question", id: "daily-question", feedKey: "daily-question" });
              result.splice(Math.min(6, result.length), 0, { kind: "feature-shortcuts", id: "feature-shortcuts", feedKey: "feature-shortcuts" });
              return result;
          ''',
          '''    result.splice(Math.min(2, result.length), 0, { kind: "daily-question", id: "daily-question", feedKey: "daily-question" });
              return result;
          ''', 1)
          old_header = '''      <View style={styles.storySection}>
                  <StoryBar
                    myAvatar={myAvatar}
                    myStories={stories.myStories}
                    friends={stories.friends}
                    navigation={navigation}
                    onChanged={refreshStories}
                  />
                </View>

                <View style={styles.feedTitleRow}>
          '''
          new_header = '''      <View style={styles.storySection}>
                  <StoryBar
                    myAvatar={myAvatar}
                    myStories={stories.myStories}
                    friends={stories.friends}
                    navigation={navigation}
                    onChanged={refreshStories}
                  />
                </View>

                {renderFeatureShortcuts()}

                <View style={styles.feedTitleRow}>
          '''
          if old_header not in s:
              raise SystemExit('header anchor not found')
          s = s.replace(old_header, new_header, 1)
          s = s.replace('''            <View>
                        {renderDailyQuestionCard()}
                        {renderFeatureShortcuts()}
                        <View style={styles.emptyCard}>
          ''', '''            <View>
                        {renderDailyQuestionCard()}
                        <View style={styles.emptyCard}>
          ''', 1)
          s = s.replace('topActions: { flexDirection: "row", gap: 9, marginTop: 5, marginBottom: 16 },', 'topActions: { flexDirection: "row", gap: 9, marginTop: 10, marginBottom: 18 },', 1)
          if 'result.splice(Math.min(6, result.length)' in s:
              raise SystemExit('feature shortcut still inserted in feed')
          if s.count('{renderFeatureShortcuts()}') != 1:
              raise SystemExit(f'unexpected shortcut render count: {s.count("{renderFeatureShortcuts()}")}')
          p.write_text(s)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate iOS and Android JS bundles
        run: |
          npx expo export --platform ios --output-dir /tmp/pellix-ios-export
          npx expo export --platform android --output-dir /tmp/pellix-android-export

      - name: Commit UX change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/ActivityScreen.js
          git diff --cached --quiet && exit 0
          git commit -m "Move MatchParty and TasteMate below stories"
          git push origin HEAD:ux-retention-v1
