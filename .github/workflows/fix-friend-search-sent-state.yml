name: Fix Friend Search Sent State

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-friend-search-sent-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch sent request state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/FriendSearchScreen.js')
          s = p.read_text()
          old = """      setRequests(data.requests || []);\n      setFriendIds(new Set((data.friends || []).map((f) => f.id)));"""
          new = """      setRequests(data.requests || []);\n      setFriendIds(new Set((data.friends || []).map((f) => f.id)));\n      setSentTo(new Set((data.sentRequests || []).map((r) => r.id)));"""
          if old not in s:
              raise SystemExit('Expected FriendSearchScreen block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir dist-friend-search-validation
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf dist-friend-search-validation
          rm .github/workflows/fix-friend-search-sent-state.yml
          git add src/screens/FriendSearchScreen.js .github/workflows/fix-friend-search-sent-state.yml
          git commit -m "Arkadaş aramasında gönderilmiş isteği göster"
          git push
