name: Refresh Token After Password Change
on:
  push:
    paths:
      - '.github/workflows/refresh-token-after-password-change.yml'
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch Settings password flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/screens/SettingsScreen.js')
          s = p.read_text()

          old = '  const { auth, logout } = useAuth();'
          new = '  const { auth, logout, handleAuthed } = useAuth();'
          if s.count(old) != 1:
              raise SystemExit(f'useAuth destructure expected once, found {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '      await api.updatePassword(auth.token, { currentPassword: currentPw, newPassword: newPw });\n      setCurrentPw(""); setNewPw(""); setPwSuccess(true);'
          new = '      const result = await api.updatePassword(auth.token, { currentPassword: currentPw, newPassword: newPw });\n      if (result?.token) await handleAuthed({ ...auth, token: result.token });\n      setCurrentPw(""); setNewPw(""); setPwSuccess(true);'
          if s.count(old) != 1:
              raise SystemExit(f'password update block expected once, found {s.count(old)}')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git diff --check
          git diff -- src/screens/SettingsScreen.js

      - name: Install dependencies
        run: npm ci

      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir dist-session-check

      - name: Commit native token refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/SettingsScreen.js
          git commit -m "Şifre değişiminde yeni oturum tokenını sakla"
          git push origin HEAD:main
