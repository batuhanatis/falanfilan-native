name: iOS Production Build and Submit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ios-production-submit.yml
      - .github/ios-build-trigger

permissions:
  contents: read

concurrency:
  group: ios-production-build-submit
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build iOS locally and submit to App Store Connect
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production iOS IPA locally
        run: eas build --platform ios --profile production --local --non-interactive --output ./pellix.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit IPA to App Store Connect
        run: eas submit --platform ios --profile production --path ./pellix.ipa --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
