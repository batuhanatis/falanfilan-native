name: Finalize share-card compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-social-legacy-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-social-legacy]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout UX retention branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          fetch-depth: 1

      - name: Apply legacy profile-card compatibility fix
        run: python scripts/fix-social-card-legacy.py

      - name: Remove temporary branch patch script
        run: rm scripts/fix-social-card-legacy.py

      - name: Install dependencies
        run: npm ci

      - name: Validate Android JS bundle
        run: npx expo export --platform android --output-dir /tmp/pellix-final-share-export

      - name: Commit final compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Keep legacy profile share cards source-accurate"
          git push origin HEAD:ux-retention-v1
