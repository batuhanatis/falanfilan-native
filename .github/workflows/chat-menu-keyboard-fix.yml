name: Chat Menu Keyboard Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-menu-keyboard-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix long-press menu while keyboard is open
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/ChatConversationScreen.js')
          s = p.read_text()
          old = '''    openMenu: (id) => {
      const item = latestRef.current.messages.find((m) => m.id === id);
      if (item) latestRef.current.setMenuFor(item);
    },'''
          new = '''    openMenu: (id) => {
      const item = latestRef.current.messages.find((m) => m.id === id);
      if (!item) return;

      // Klavye açıkken alttan açılan mesaj menüsü onun arkasında kalabiliyordu. Menü bir
      // "bottom sheet" olduğu için en güvenilir davranış, önce klavyeyi kapatıp sheet'i yeni
      // kullanılabilir ekran yüksekliğine yerleştirmek. Klavye zaten kapalıysa gecikme yok.
      const keyboardVisible = Keyboard.isVisible?.() ?? false;
      if (keyboardVisible) {
        Keyboard.dismiss();
        setTimeout(() => latestRef.current.setMenuFor(item), Platform.OS === "ios" ? 180 : 100);
      } else {
        latestRef.current.setMenuFor(item);
      }
    },'''
          if old not in s:
              raise SystemExit('Beklenen openMenu bloğu bulunamadı')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate Expo export
        run: npx expo export --platform ios --output-dir dist-chat-menu-validation
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/ChatConversationScreen.js
          git commit -m "Klavye açıkken chat mesaj menüsünü görünür tut"
          git push
