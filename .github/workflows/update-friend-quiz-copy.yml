name: Update Friend Quiz Copy
on:
  push:
    paths:
      - '.github/workflows/update-friend-quiz-copy.yml'
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply copy patch
        run: python .github/scripts/update_friend_quiz_copy.py
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir dist-friend-quiz-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir dist-friend-quiz-ios
      - name: Commit native change and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-friend-quiz-copy.yml .github/scripts/update_friend_quiz_copy.py
          git add src/screens/PellixPlayScreen.js .github
          git commit -m "Arkadaş testi beğeni tabanlı akış metinlerini güncelle"
          git push origin HEAD:main
