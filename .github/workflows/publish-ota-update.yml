name: Publish OTA Update (production)

# Production OTA'lar GitHub macOS runner'ından çalışır; fingerprint runtimeVersion iOS native
# fingerprint'inin production build ile eşleşmesi için Xcode/CocoaPods ortamına ihtiyaç duyar.

on:
  push:
    branches: [main]
    paths:
      - '.github/ota-trigger'
      - '.github/workflows/publish-ota-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish OTA update to production channel
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_BASE: https://api.pellix.app

    steps:
      - name: Checkout current production UX branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify production target
        run: |
          test "$EXPO_PUBLIC_API_BASE" = "https://api.pellix.app"
          node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync("eas.json","utf8")); if(e.build?.production?.channel!=="production") process.exit(1)'

      - name: Verify runtime compatibility before publishing
        run: |
          npx expo-updates runtimeversion:resolve --platform ios > "$RUNNER_TEMP/pellix-runtime-ios.json"
          npx expo-updates runtimeversion:resolve --platform android > "$RUNNER_TEMP/pellix-runtime-android.json"
          node <<'NODE'
          const fs = require('fs');
          const expected = {
            ios: '88c1bbbc0f2ed9b1e573a105c4f791cf61a67ac5',
            android: '947eb191d3afb3b2cbf3fdf445c2cf9243792126',
          };
          for (const [platform, runtime] of Object.entries(expected)) {
            const file = process.env.RUNNER_TEMP + '/pellix-runtime-' + platform + '.json';
            const actual = JSON.parse(fs.readFileSync(file, 'utf8')).runtimeVersion;
            console.log(platform + ' runtime: ' + actual);
            if (actual !== runtime) throw new Error(platform + ' runtime differs from the last production OTA; stop before publishing.');
          }
          NODE

      - name: Verify planner API is available
        run: |
          node <<'NODE'
          (async () => {
            const res = await fetch('https://api.pellix.app/api/tonight/options', { signal: AbortSignal.timeout(20000) });
            const body = await res.json();
            if (res.status !== 401 || !body.error) throw new Error('Planner API is not ready');
            console.log('Planner API is live and enforces authentication');
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE

      - name: Publish OTA update
        run: >-
          eas update --channel production --platform all --environment production --non-interactive
          --message "Bu Aksami Planla: premium platforms and shared profiles"
