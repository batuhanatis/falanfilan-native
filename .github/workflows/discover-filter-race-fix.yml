name: Discover Filter Race Fix
on:
  push:
    paths:
      - '.github/workflows/discover-filter-race-fix.yml'
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply discover filter race fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/DiscoverScreen.js')
          s = p.read_text()

          old = '''  const [stockReady, setStockReady] = useState(false);\n  const growingRef = useRef(false);\n  const cardRef = useRef(null);\n'''
          new = '''  const [stockReady, setStockReady] = useState(false);\n  // Filtreler arasında hızlı geçişte eski async öneri isteklerinin yeni filtrenin\n  // kuyruğunu ezmesini engellemek için her filtre yüklemesine bir nesil numarası veriyoruz.\n  const filterGenerationRef = useRef(0);\n  const activeFilterRef = useRef("All");\n  // Aynı filtre nesli için birden fazla eşzamanlı kuyruk büyütme isteğini engeller;\n  // farklı nesiller ise paralel çalışabilir ve eski olanlar sonuç yazamaz.\n  const growingRef = useRef(new Set());\n  const cardRef = useRef(null);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  const growQueue = useCallback(async (existingQueue, existingShown, existingFilter) => {\n    if (growingRef.current) return [];\n    growingRef.current = true;\n    try {\n      const votedIds = await getVotedIds();\n      const usedIds = new Set([...existingQueue.map((m) => m.id), ...existingShown, ...votedIds]);\n      const data = await api.recommendations(auth.token);\n      return (data.results || [])\n        .filter((m) => !usedIds.has(m.id))\n        .filter((m) => existingFilter === "All" || (existingFilter === "Movie" ? m.type === "Film" : m.type === "Dizi"))\n        .slice(0, Math.max(STOCK_TARGET, 18));\n    } catch {\n      return [];\n    } finally {\n      growingRef.current = false;\n    }\n  }, [auth.token]);\n'''
          new = '''  const growQueue = useCallback(async (existingQueue, existingShown, existingFilter, generation = filterGenerationRef.current) => {\n    const growKey = `${generation}:${existingFilter}`;\n    if (growingRef.current.has(growKey)) return [];\n    growingRef.current.add(growKey);\n    try {\n      const votedIds = await getVotedIds();\n      const usedIds = new Set([...existingQueue.map((m) => m.id), ...existingShown, ...votedIds]);\n      const data = await api.recommendations(auth.token);\n      return (data.results || [])\n        .filter((m) => !usedIds.has(m.id))\n        .filter((m) => existingFilter === "All" || (existingFilter === "Movie" ? m.type === "Film" : m.type === "Dizi"))\n        .slice(0, Math.max(STOCK_TARGET, 18));\n    } catch {\n      return [];\n    } finally {\n      growingRef.current.delete(growKey);\n    }\n  }, [auth.token]);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  const resetForFilter = useCallback(async (nextFilter) => {\n    setStockReady(false);\n    setShownIds(new Set());\n    setQueue([]);\n    setSessionLikes(0);\n    setSessionSkips(0);\n    setSessionGenreCounts({});\n'''
          new = '''  const resetForFilter = useCallback(async (nextFilter) => {\n    const generation = ++filterGenerationRef.current;\n    activeFilterRef.current = nextFilter;\n    setStockReady(false);\n    setShownIds(new Set());\n    setQueue([]);\n    setSessionLikes(0);\n    setSessionSkips(0);\n    setSessionGenreCounts({});\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''      const votedIds = await getVotedIds();\n      const fresh = preloaded.filter((m) => !votedIds.has(m.id));\n      setQueue(fresh);\n      setStockReady(true);\n      return;\n'''
          new = '''      const votedIds = await getVotedIds();\n      if (generation !== filterGenerationRef.current || activeFilterRef.current !== nextFilter) return;\n      const fresh = preloaded\n        .filter((m) => !votedIds.has(m.id))\n        .filter((m) => nextFilter === "All" || (nextFilter === "Movie" ? m.type === "Film" : m.type === "Dizi"));\n      setQueue(fresh);\n      setStockReady(true);\n      return;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    prefetchedDiscoverRef.current = null;\n    const gathered = await growQueue([], new Set(), nextFilter);\n    setQueue(gathered);\n    setStockReady(true);\n  }, [growQueue]);\n'''
          new = '''    prefetchedDiscoverRef.current = null;\n    const gathered = await growQueue([], new Set(), nextFilter, generation);\n    if (generation !== filterGenerationRef.current || activeFilterRef.current !== nextFilter) return;\n    setQueue(gathered.filter((m) => nextFilter === "All" || (nextFilter === "Movie" ? m.type === "Film" : m.type === "Dizi")));\n    setStockReady(true);\n  }, [growQueue]);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  async function replenishIfLow(restQueue, newShown) {\n    if (restQueue.length >= STOCK_TARGET) return;\n    const gathered = await growQueue(restQueue, newShown, filterType);\n    if (gathered.length > 0) setQueue((prev) => [...prev, ...gathered]);\n  }\n'''
          new = '''  async function replenishIfLow(restQueue, newShown) {\n    if (restQueue.length >= STOCK_TARGET) return;\n    const expectedFilter = filterType;\n    const generation = filterGenerationRef.current;\n    const gathered = await growQueue(restQueue, newShown, expectedFilter, generation);\n    if (generation !== filterGenerationRef.current || activeFilterRef.current !== expectedFilter) return;\n    if (gathered.length > 0) {\n      setQueue((prev) => {\n        // Son savunma hattı: aktif filtrenin dışındaki bir kart hiçbir koşulda kuyruğa kalmasın.\n        const validPrev = prev.filter((m) => expectedFilter === "All" || (expectedFilter === "Movie" ? m.type === "Film" : m.type === "Dizi"));\n        const seen = new Set(validPrev.map((m) => m.id));\n        const validNew = gathered.filter((m) => !seen.has(m.id) && (expectedFilter === "All" || (expectedFilter === "Movie" ? m.type === "Film" : m.type === "Dizi")));\n        return [...validPrev, ...validNew];\n      });\n    }\n  }\n'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir /tmp/pellix-filter-race-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir /tmp/pellix-filter-race-ios
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/DiscoverScreen.js
          git commit -m "Keşfet filtre yarış durumunu düzelt"
          git push
