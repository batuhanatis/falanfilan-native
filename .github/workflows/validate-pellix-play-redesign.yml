name: Validate Pellix Play Redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-pellix-play-redesign.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir dist-play-redesign-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir dist-play-redesign-ios
