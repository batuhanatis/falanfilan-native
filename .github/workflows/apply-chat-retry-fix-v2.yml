name: Apply chat retry reliability fix v2

on:
  push:
    paths:
      - '.github/workflows/apply-chat-retry-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply retry patch
        run: python tools/apply_chat_retry_fix.py
      - name: Verify patch markers
        run: |
          grep -q 'MAX_AUTO_RETRIES = 5' src/screens/ChatConversationScreen.js
          grep -q '_autoRetryStopped' src/screens/ChatConversationScreen.js
      - name: Commit patch
        run: |
          git config user.name "Pellix Reliability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/ChatConversationScreen.js
          git commit -m "Mesaj retry politikasını kalıcı hatalarda durdur" || exit 0
          git push
