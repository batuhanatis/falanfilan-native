name: Diary Rating Share Patch

on:
  push:
    paths:
      - '.github/workflows/diary-rating-share-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current app branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add Diary rating social share flow
        shell: bash
        run: |
          cat > src/components/RatingShareCard.js <<'EOF'
          import React from "react";
          import { Image, StyleSheet, Text, TouchableOpacity, View } from "react-native";
          import { LinearGradient } from "expo-linear-gradient";
          import { Star } from "lucide-react-native";

          export default function RatingShareCard({ movie, rating, note, onPress }) {
            const score = Number(rating);
            const safeScore = Number.isFinite(score) ? Math.max(1, Math.min(10, Math.round(score))) : null;
            const card = (
              <LinearGradient colors={["#0A0A0F", "#1A1410", "#32230D"]} style={styles.card}>
                <View style={styles.goldGlow} />
                <View style={styles.topRow}>
                  <View>
                    <Text style={styles.brand}>pellix</Text>
                    <Text style={styles.type}>DIARY RATING</Text>
                  </View>
                  <View style={styles.badge}>
                    <Star size={10} color="#FFD76A" fill="#FFD76A" />
                    <Text style={styles.badgeText}>İZLEDİM</Text>
                  </View>
                </View>

                <View style={styles.movieRow}>
                  {movie?.poster ? (
                    <Image source={{ uri: movie.poster }} style={styles.poster} />
                  ) : (
                    <View style={[styles.poster, styles.posterEmpty]} />
                  )}
                  <View style={styles.copy}>
                    <Text style={styles.title} numberOfLines={2}>{movie?.title || "İzlediğim içerik"}</Text>
                    <Text style={styles.meta} numberOfLines={1}>
                      {[movie?.type, movie?.year].filter(Boolean).join(" · ") || "Pellix Diary"}
                    </Text>
                    <View style={styles.scoreRow}>
                      <Text style={styles.score}>{safeScore ?? "—"}</Text>
                      <View>
                        <Text style={styles.outOf}>/10</Text>
                        <Text style={styles.scoreLabel}>PELLIX PUANIM</Text>
                      </View>
                    </View>
                  </View>
                </View>

                {!!note && (
                  <View style={styles.noteBox}>
                    <Text style={styles.quote}>“</Text>
                    <Text style={styles.note} numberOfLines={3}>{note}</Text>
                  </View>
                )}

                <View style={styles.footer}>
                  <Text style={styles.footerText}>İzledim. Puanladım. Zevkim biraz daha netleşti.</Text>
                  {!!onPress && <Text style={styles.openText}>İçeriği aç →</Text>}
                </View>
              </LinearGradient>
            );

            if (!onPress) return card;
            return <TouchableOpacity onPress={onPress} activeOpacity={0.9}>{card}</TouchableOpacity>;
          }

          const styles = StyleSheet.create({
            card: { marginTop: 12, borderRadius: 22, padding: 16, overflow: "hidden", borderWidth: 1, borderColor: "rgba(255,215,106,0.16)" },
            goldGlow: { position: "absolute", width: 190, height: 190, borderRadius: 999, right: -90, top: -110, backgroundColor: "rgba(240,180,41,0.12)" },
            topRow: { flexDirection: "row", alignItems: "flex-start", justifyContent: "space-between" },
            brand: { color: "#fff", fontSize: 15, lineHeight: 17, fontWeight: "900" },
            type: { color: "rgba(255,255,255,0.42)", fontSize: 7.2, fontWeight: "900", letterSpacing: 1.1, marginTop: 1 },
            badge: { flexDirection: "row", alignItems: "center", gap: 4, borderRadius: 999, paddingHorizontal: 8, paddingVertical: 4, backgroundColor: "rgba(255,215,106,0.08)", borderWidth: 1, borderColor: "rgba(255,215,106,0.18)" },
            badgeText: { color: "#FFD76A", fontSize: 7, fontWeight: "900", letterSpacing: 0.55 },
            movieRow: { flexDirection: "row", gap: 14, alignItems: "center", marginTop: 16 },
            poster: { width: 74, height: 108, borderRadius: 13, backgroundColor: "rgba(255,255,255,0.06)" },
            posterEmpty: { borderWidth: 1, borderColor: "rgba(255,255,255,0.08)" },
            copy: { flex: 1, minWidth: 0 },
            title: { color: "#fff", fontSize: 18, lineHeight: 22, fontWeight: "900" },
            meta: { color: "rgba(255,255,255,0.48)", fontSize: 9.5, fontWeight: "700", marginTop: 4 },
            scoreRow: { flexDirection: "row", alignItems: "flex-end", gap: 6, marginTop: 12 },
            score: { color: "#FFD76A", fontSize: 42, lineHeight: 44, fontWeight: "950", fontVariant: ["tabular-nums"] },
            outOf: { color: "rgba(255,255,255,0.78)", fontSize: 13, fontWeight: "900", marginBottom: 2 },
            scoreLabel: { color: "rgba(255,255,255,0.34)", fontSize: 6.8, fontWeight: "900", letterSpacing: 0.8, marginBottom: 5 },
            noteBox: { marginTop: 14, borderRadius: 14, paddingHorizontal: 12, paddingVertical: 11, backgroundColor: "rgba(255,255,255,0.045)", borderWidth: 1, borderColor: "rgba(255,255,255,0.07)", flexDirection: "row", gap: 7 },
            quote: { color: "#FFD76A", fontSize: 22, lineHeight: 22, fontWeight: "900" },
            note: { flex: 1, color: "rgba(255,255,255,0.74)", fontSize: 10.5, lineHeight: 15, fontWeight: "600" },
            footer: { marginTop: 14, paddingTop: 11, borderTopWidth: 1, borderTopColor: "rgba(255,255,255,0.07)", flexDirection: "row", alignItems: "center", justifyContent: "space-between", gap: 10 },
            footerText: { flex: 1, color: "rgba(255,255,255,0.38)", fontSize: 8.5, fontWeight: "700" },
            openText: { color: "#FFD76A", fontSize: 8.5, fontWeight: "900" },
          });
          EOF

          cat > src/components/DiaryEntryModal.js <<'EOF'
          import React, { useEffect, useState } from "react";
          import {
            Modal,
            View,
            Text,
            TouchableOpacity,
            TextInput,
            StyleSheet,
            ScrollView,
            ActivityIndicator,
            KeyboardAvoidingView,
            Platform,
          } from "react-native";
          import { useSafeAreaInsets } from "react-native-safe-area-context";
          import { Check, Trash2, X, Star, CalendarDays, BookOpen, ChevronRight, Share2 } from "lucide-react-native";
          import { useAppTheme } from "../context/ThemeContext";
          import { useAuth } from "../context/AuthContext";
          import { diaryApi } from "../api/diary";
          import { api } from "../api/client";
          import { hapticSuccess } from "../utils/haptics";
          import RatingShareCard from "./RatingShareCard";

          export default function DiaryEntryModal({ visible, movie, entry, onClose, onSaved, onRemoved, onOpenDiary }) {
            const { c } = useAppTheme();
            const { auth } = useAuth();
            const insets = useSafeAreaInsets();
            const styles = makeStyles(c, insets);
            const [rating, setRating] = useState(null);
            const [note, setNote] = useState("");
            const [saving, setSaving] = useState(false);
            const [removing, setRemoving] = useState(false);
            const [sharing, setSharing] = useState(false);
            const [shareDraft, setShareDraft] = useState(null);
            const [error, setError] = useState("");

            useEffect(() => {
              if (!visible) return;
              setRating(entry?.rating ?? null);
              setNote(entry?.note || "");
              setShareDraft(null);
              setSharing(false);
              setError("");
            }, [visible, entry?.rating, entry?.note, movie?.id]);

            async function save() {
              if (!movie?.id || saving) return;
              const previousRating = entry?.rating ?? null;
              setSaving(true);
              setError("");
              try {
                const result = await diaryApi.save(auth.token, movie.id, {
                  watchedAt: entry?.watchedAt || new Date().toISOString(),
                  rating,
                  note: note.trim() || null,
                });
                hapticSuccess();
                onSaved?.(result.entry);

                const savedRating = result.entry?.rating ?? rating;
                const isFirstRating = previousRating == null && savedRating != null;
                if (isFirstRating) {
                  setShareDraft({
                    rating: Number(savedRating),
                    note: result.entry?.note || note.trim() || null,
                    watchedAt: result.entry?.watchedAt || new Date().toISOString(),
                  });
                } else {
                  onClose?.();
                }
              } catch (e) {
                setError(e.message || "Kaydedilemedi.");
              }
              setSaving(false);
            }

            async function shareRating() {
              if (!shareDraft || sharing || !movie?.id) return;
              setSharing(true);
              setError("");
              try {
                await api.socialCreatePost(auth.token, {
                  type: "card",
                  body: "",
                  cardPayload: {
                    kind: "diary_rating",
                    rating: Number(shareDraft.rating),
                    note: shareDraft.note || null,
                    watchedAt: shareDraft.watchedAt || null,
                    movie: {
                      id: Number(movie.id),
                      title: movie.title || null,
                      poster: movie.poster || null,
                      type: movie.type || null,
                      year: movie.year || null,
                    },
                  },
                });
                hapticSuccess();
                onClose?.();
              } catch (e) {
                setError(e.message || "Sosyal paylaşım oluşturulamadı.");
              }
              setSharing(false);
            }

            async function remove() {
              if (!movie?.id || removing) return;
              setRemoving(true);
              setError("");
              try {
                await diaryApi.remove(auth.token, movie.id);
                onRemoved?.();
                onClose?.();
              } catch (e) {
                setError(e.message || "Günlük kaydı silinemedi.");
              }
              setRemoving(false);
            }

            return (
              <Modal visible={visible} transparent animationType="fade" onRequestClose={onClose}>
                <KeyboardAvoidingView
                  style={styles.backdrop}
                  behavior={Platform.OS === "ios" ? "padding" : "height"}
                  keyboardVerticalOffset={0}
                >
                  <TouchableOpacity style={StyleSheet.absoluteFillObject} activeOpacity={1} onPress={onClose} />
                  <View style={styles.card}>
                    {shareDraft ? (
                      <ScrollView contentContainerStyle={styles.cardContent} showsVerticalScrollIndicator={false}>
                        <View style={styles.header}>
                          <View style={{ flex: 1, minWidth: 0 }}>
                            <Text style={styles.eyebrow}>PUANIN KAYDEDİLDİ</Text>
                            <Text style={styles.shareTitle}>Bunu Sosyal’de paylaş?</Text>
                            <Text style={styles.shareSubtitle}>Feed’e yalnızca sen onaylarsan düşer.</Text>
                          </View>
                          <TouchableOpacity style={styles.closeBtn} onPress={onClose}>
                            <X size={17} color={c.text} />
                          </TouchableOpacity>
                        </View>

                        <RatingShareCard movie={movie} rating={shareDraft.rating} note={shareDraft.note} />

                        {!!error && <Text style={styles.error}>{error}</Text>}

                        <TouchableOpacity style={styles.shareBtn} onPress={shareRating} disabled={sharing} activeOpacity={0.86}>
                          {sharing ? <ActivityIndicator size="small" color="#14121a" /> : <>
                            <Share2 size={16} color="#14121a" strokeWidth={2.5} />
                            <Text style={styles.shareBtnText}>Sosyal’de Paylaş</Text>
                          </>}
                        </TouchableOpacity>
                        <TouchableOpacity style={styles.skipBtn} onPress={onClose} disabled={sharing}>
                          <Text style={styles.skipText}>Şimdilik değil</Text>
                        </TouchableOpacity>
                      </ScrollView>
                    ) : (
                      <ScrollView
                        contentContainerStyle={styles.cardContent}
                        showsVerticalScrollIndicator={false}
                        keyboardShouldPersistTaps="handled"
                        keyboardDismissMode="interactive"
                      >
                        <View style={styles.header}>
                          <View style={{ flex: 1, minWidth: 0 }}>
                            <Text style={styles.eyebrow}>PELLIX DIARY</Text>
                            <Text style={styles.title} numberOfLines={1}>{movie?.title || "İzlediğin içerik"}</Text>
                            <View style={styles.dateRow}>
                              <CalendarDays size={11} color={c.dim} />
                              <Text style={styles.dateText}>
                                {entry?.watchedAt
                                  ? new Date(entry.watchedAt).toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" })
                                  : "Bugün izlendi olarak kaydedilecek"}
                              </Text>
                            </View>
                          </View>
                          <TouchableOpacity style={styles.closeBtn} onPress={onClose}>
                            <X size={17} color={c.text} />
                          </TouchableOpacity>
                        </View>

                        <Text style={styles.label}>PUANIN</Text>
                        <Text style={styles.helper}>İstersen boş bırakabilirsin. Pellix puanın 10 üzerinden.</Text>
                        <ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={styles.ratingRow} keyboardShouldPersistTaps="handled">
                          {Array.from({ length: 10 }, (_, i) => i + 1).map((value) => (
                            <TouchableOpacity
                              key={value}
                              style={[styles.ratingChip, rating === value && styles.ratingChipActive]}
                              onPress={() => setRating((current) => current === value ? null : value)}
                            >
                              <Star size={11} color={rating === value ? "#14121a" : c.accent} fill={rating === value ? "#14121a" : "none"} />
                              <Text style={[styles.ratingText, rating === value && styles.ratingTextActive]}>{value}</Text>
                            </TouchableOpacity>
                          ))}
                        </ScrollView>

                        <Text style={styles.label}>KISA NOT</Text>
                        <TextInput
                          style={styles.noteInput}
                          value={note}
                          onChangeText={(text) => setNote(text.slice(0, 500))}
                          placeholder="Finali, oyunculukları, sende bıraktığı his…"
                          placeholderTextColor={c.dim}
                          multiline
                          maxLength={500}
                          textAlignVertical="top"
                        />
                        <Text style={styles.charCount}>{note.length}/500</Text>

                        {!!error && <Text style={styles.error}>{error}</Text>}

                        <TouchableOpacity style={styles.saveBtn} onPress={save} disabled={saving} activeOpacity={0.86}>
                          {saving ? <ActivityIndicator size="small" color="#14121a" /> : <>
                            <Check size={16} color="#14121a" strokeWidth={2.6} />
                            <Text style={styles.saveText}>{entry ? "Günlüğü Güncelle" : "İzledim Olarak Kaydet"}</Text>
                          </>}
                        </TouchableOpacity>

                        {!!entry && (
                          <TouchableOpacity style={styles.removeBtn} onPress={remove} disabled={removing}>
                            {removing ? <ActivityIndicator size="small" color={c.danger} /> : <>
                              <Trash2 size={14} color={c.danger} />
                              <Text style={styles.removeText}>İzledim kaydını kaldır</Text>
                            </>}
                          </TouchableOpacity>
                        )}

                        {!!onOpenDiary && (
                          <TouchableOpacity
                            style={styles.openDiaryBtn}
                            onPress={() => { onClose?.(); onOpenDiary(); }}
                            activeOpacity={0.82}
                          >
                            <BookOpen size={14} color={c.text} />
                            <Text style={styles.openDiaryText}>Tüm Pellix Diary’mi Gör</Text>
                            <ChevronRight size={14} color={c.dim} />
                          </TouchableOpacity>
                        )}
                      </ScrollView>
                    )}
                  </View>
                </KeyboardAvoidingView>
              </Modal>
            );
          }

          function makeStyles(c, insets) {
            return StyleSheet.create({
              backdrop: {
                flex: 1,
                backgroundColor: "rgba(0,0,0,0.72)",
                justifyContent: "center",
                paddingHorizontal: 18,
                paddingTop: Math.max(18, insets.top + 8),
                paddingBottom: Math.max(18, insets.bottom + 8),
              },
              card: { backgroundColor: c.surface, borderWidth: 1, borderColor: c.border, borderRadius: 24, maxHeight: "88%", overflow: "hidden" },
              cardContent: { padding: 18, paddingBottom: Math.max(18, insets.bottom + 12) },
              header: { flexDirection: "row", alignItems: "flex-start", gap: 12 },
              eyebrow: { color: c.accent, fontSize: 9.5, fontWeight: "900", letterSpacing: 1 },
              title: { color: c.text, fontSize: 20, fontWeight: "900", marginTop: 3 },
              shareTitle: { color: c.text, fontSize: 19, fontWeight: "900", marginTop: 3 },
              shareSubtitle: { color: c.dim, fontSize: 10.5, marginTop: 4 },
              dateRow: { flexDirection: "row", alignItems: "center", gap: 5, marginTop: 5 },
              dateText: { color: c.dim, fontSize: 10.5 },
              closeBtn: { width: 34, height: 34, borderRadius: 999, backgroundColor: c.surface2, alignItems: "center", justifyContent: "center" },
              label: { color: c.text, fontSize: 10, fontWeight: "900", letterSpacing: 0.7, marginTop: 20 },
              helper: { color: c.dim, fontSize: 10.5, marginTop: 3 },
              ratingRow: { gap: 7, paddingTop: 10, paddingBottom: 3 },
              ratingChip: { minWidth: 44, height: 36, borderRadius: 12, borderWidth: 1, borderColor: c.border, backgroundColor: c.surface2, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 4, paddingHorizontal: 8 },
              ratingChipActive: { backgroundColor: c.accent, borderColor: c.accent },
              ratingText: { color: c.text, fontSize: 11.5, fontWeight: "800" },
              ratingTextActive: { color: "#14121a" },
              noteInput: { minHeight: 104, marginTop: 9, borderRadius: 14, borderWidth: 1, borderColor: c.border, backgroundColor: c.surface2, padding: 12, color: c.text, fontSize: 12.5, lineHeight: 18 },
              charCount: { color: c.dim, fontSize: 9.5, alignSelf: "flex-end", marginTop: 4 },
              error: { color: c.danger, fontSize: 11, marginTop: 8, textAlign: "center" },
              saveBtn: { minHeight: 46, marginTop: 14, borderRadius: 14, backgroundColor: c.accent, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 7 },
              saveText: { color: "#14121a", fontSize: 12.5, fontWeight: "900" },
              shareBtn: { minHeight: 48, marginTop: 14, borderRadius: 14, backgroundColor: c.accent, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 7 },
              shareBtnText: { color: "#14121a", fontSize: 12.5, fontWeight: "900" },
              skipBtn: { minHeight: 40, marginTop: 3, alignItems: "center", justifyContent: "center" },
              skipText: { color: c.dim, fontSize: 11.5, fontWeight: "700" },
              removeBtn: { marginTop: 8, minHeight: 36, borderRadius: 12, flexDirection: "row", alignItems: "center", justifyContent: "center", gap: 6 },
              removeText: { color: c.danger, fontSize: 11.5, fontWeight: "700" },
              openDiaryBtn: { minHeight: 42, marginTop: 5, paddingHorizontal: 11, borderRadius: 12, backgroundColor: c.surface2, borderWidth: 1, borderColor: c.border, flexDirection: "row", alignItems: "center", gap: 7 },
              openDiaryText: { flex: 1, color: c.text, fontSize: 11.5, fontWeight: "800" },
            });
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          shared = Path('src/components/SocialSharedCard.js')
          s = shared.read_text()
          import_marker = 'import { verdictFor } from "../utils/blendVerdict";\n'
          if 'import RatingShareCard from "./RatingShareCard";' not in s:
              if import_marker not in s:
                  raise SystemExit('SocialSharedCard import marker not found')
              s = s.replace(import_marker, import_marker + 'import RatingShareCard from "./RatingShareCard";\n', 1)
          marker = '  if (!payload) return null;\n\n'
          insert = '''  if (payload.kind === "diary_rating") {\n    const movie = payload.movie || null;\n    const open = () => {\n      if (movie?.id) navigation.navigate("Detail", { movie });\n    };\n    return (\n      <RatingShareCard\n        movie={movie}\n        rating={payload.rating}\n        note={payload.note}\n        onPress={movie?.id ? open : undefined}\n      />\n    );\n  }\n\n'''
          if 'payload.kind === "diary_rating"' not in s:
              if marker not in s:
                  raise SystemExit('SocialSharedCard insertion marker not found')
              s = s.replace(marker, marker + insert, 1)
          shared.write_text(s)

          feed = Path('src/components/SocialFeedCard.js')
          s = feed.read_text()
          old = '''function postLabel(type) {\n  if (type === "recommend") return "öneriyor";\n  if (type === "poll") return "soruyor";\n  if (type === "card") return "bir kart paylaştı";\n  return "paylaştı";\n}\n'''
          new = '''function postLabel(type, cardPayload) {\n  if (type === "recommend") return "öneriyor";\n  if (type === "poll") return "soruyor";\n  if (type === "card" && cardPayload?.kind === "diary_rating") return "puanını paylaştı";\n  if (type === "card") return "bir kart paylaştı";\n  return "paylaştı";\n}\n'''
          if old not in s:
              raise SystemExit('SocialFeedCard postLabel marker not found')
          s = s.replace(old, new, 1)
          old_call = '{state.kind === "post" ? `${postLabel(post?.type)} · ` : ""}{relativeTime(state.created_at)}'
          new_call = '{state.kind === "post" ? `${postLabel(post?.type, post?.cardPayload)} · ` : ""}{relativeTime(state.created_at)}'
          if old_call not in s:
              raise SystemExit('SocialFeedCard postLabel call marker not found')
          s = s.replace(old_call, new_call, 1)
          feed.write_text(s)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JS bundles
        run: |
          npx expo export --platform ios --output-dir dist-ios
          npx expo export --platform android --output-dir dist-android

      - name: Commit app changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DiaryEntryModal.js src/components/RatingShareCard.js src/components/SocialSharedCard.js src/components/SocialFeedCard.js
          git commit -m "Add opt-in Diary rating share cards"
          git push origin HEAD:ux-retention-v1
