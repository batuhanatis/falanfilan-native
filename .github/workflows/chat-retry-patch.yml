name: Chat retry patch
on:
  push:
    paths:
      - '.github/workflows/chat-retry-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/apply_chat_retry_fix.py
      - run: |
          git config user.name "Pellix Reliability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/ChatConversationScreen.js
          git commit -m "Mesaj retry politikasını kalıcı hatalarda durdur"
          git push
