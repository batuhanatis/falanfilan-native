name: Popular All 20 Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/popular-all-20-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch HomeScreen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/HomeScreen.js')
          s = p.read_text()
          old = 'if (!cancelled) setPopularNow(dedupe(merged).slice(0, 10));'
          new = 'if (!cancelled) setPopularNow(dedupe(merged).slice(0, 20));'
          if old not in s:
              raise SystemExit('Beklenen satır bulunamadı')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/HomeScreen.js
          git commit -m "Tüm filtresinde 20 popüler içerik göster"
          git push
