name: Home Activity Nav Reposition
on:
  push:
    paths:
      - '.github/workflows/home-activity-nav-reposition.yml'
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply home and activity reposition
        run: python .github/scripts/home_activity_nav_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir /tmp/pellix-home-activity-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir /tmp/pellix-home-activity-ios
      - name: Validate diff
        run: git diff --check
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/home-activity-nav-reposition.yml
          rm -f .github/scripts/home_activity_nav_patch.py
          git add src .github
          git commit -m "Eski ana sayfayı geri getir ve aktiviteyi sekmeye taşı"
          git push
