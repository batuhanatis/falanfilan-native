name: Patch share refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-share-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-share-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout UX retention branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          fetch-depth: 1

      - name: Apply share refresh patch
        run: python scripts/patch-share-refresh.py

      - name: Remove temporary patch script
        run: rm scripts/patch-share-refresh.py

      - name: Install dependencies
        run: npm ci

      - name: Validate Android JS bundle
        run: npx expo export --platform android --output-dir /tmp/pellix-share-export

      - name: Commit changes to UX branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add social Poster Puzzle sharing and refresh share cards"
          git push origin HEAD:ux-retention-v1

# retry: corrected ProfileShareCard prop matching
