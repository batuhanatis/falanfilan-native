name: Publish Pellix preview OTA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-preview-ota-temp.yml'

permissions:
  contents: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[preview-ota]')
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_BASE: https://pellix-api-staging.onrender.com
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: goog_onoNWVFZmxVZzlZSlBBWatYEfXn
    steps:
      - name: Checkout UX retention branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify preview backend target
        run: |
          test "$EXPO_PUBLIC_API_BASE" = "https://pellix-api-staging.onrender.com"
          node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync("eas.json","utf8")); if(e.build?.preview?.channel!=="preview" || e.build?.production?.channel!=="production") process.exit(1)'

      - name: Publish preview OTA only
        run: >-
          eas update --channel preview --platform all --environment production --non-interactive
          --message "Preview share cards and Poster Puzzle social"
