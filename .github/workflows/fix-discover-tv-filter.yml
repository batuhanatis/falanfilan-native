name: Fix Discover TV Filter
on:
  push:
    paths:
      - '.github/workflows/fix-discover-tv-filter.yml'
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix TV filter queue source
        run: echo '' | base64 -d | python
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir /tmp/pellix-tv-filter-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir /tmp/pellix-tv-filter-ios
      - name: Validate diff
        run: git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-discover-tv-filter.yml
          git add src/screens/DiscoverScreen.js .github/workflows/fix-discover-tv-filter.yml
          git commit -m "Keşfet dizi filtresini düzelt"
          git push
