name: Apply Home popular spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-popular-spacing-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[popular-spacing]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main helper
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preserve patch helper
        run: cp .github/scripts/space-popular-section.py /tmp/space-popular-section.py

      - name: Checkout UX branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          clean: true

      - name: Apply spacing patch
        run: python /tmp/space-popular-section.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate all JS bundles
        run: |
          npx expo export --platform ios --output-dir /tmp/pellix-ios-export
          npx expo export --platform android --output-dir /tmp/pellix-android-export

      - name: Commit UX changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/HomeScreenV2.js
          git commit -m 'Add breathing room before Popular Now'
          git push origin HEAD:ux-retention-v1
