name: Publish OTA Update (production)

# ÖNEMLİ: eas update BURADAN (GitHub'ın macOS runner'ından) çalışmalı, yerel bir Windows
# makinesinden DEĞİL — "fingerprint" runtimeVersion politikası, iOS için gerçek Xcode/CocoaPods
# araçlarının ürettiği native proje çıktısına bakıyor. Windows'ta bu araçlar hiç olmadığı için
# oradan hesaplanan fingerprint, production build'in (macOS'ta, aynı runner tipinde derlenen)
# GERÇEK fingerprint'iyle hiçbir zaman eşleşmiyor — sonuç: sunucuya doğru update yüklenir ama
# cihaz kendi fingerprint'i için hiç eşleşen bir update bulamadığından sessizce hiçbir şey olmaz.
# Bu workflow, production build'i üreten AYNI runner tipinde (macos-26) çalışarak fingerprint'in
# birebir eşleşmesini garanti ediyor.

on:
  push:
    branches: [main]
    paths:
      - '.github/ota-trigger'
      - '.github/workflows/publish-ota-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish OTA update to production channel
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # ÖNEMLİ DÜZELTME: eas-cli@latest (expo/expo-github-action'ın kurduğu), bir bağımlılığı
          # (@oclif/plugin-autocomplete) üzerinden artık Node >=22 istiyor — 20 ile "yarn add
          # eas-cli" "incompatible module" hatasıyla patlıyordu (Setup EAS adımı). eas-cli
          # "latest" sabitlendiği için bu eşik bizim kontrolümüz dışında ileride yine değişebilir.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        # ÖNEMLİ (kökten düzeltme): --environment olmadan, EAS'ta tanımlı sunucu taraflı ortam
        # değişkenleri (Google client ID'leri, RevenueCat iOS key) BUNDLE'A HİÇ enjekte edilmiyor
        # — "eas update" bunu "eas build"in aksine PROFİLDEN otomatik çıkaramıyor, açıkça
        # istiyor (eas-cli: "Required for projects using Expo SDK 55 or greater"). Bu bayrak
        # olmadan yayınlanan HER OTA güncellemesi, GoogleSignin.configure()'a webClientId/
        # iosClientId=undefined geçiriyordu — bu da Google ile girişte backend'in "Geçersiz
        # Google jetonu" ile reddettiği, audience'ı eşleşmeyen bir idToken üretiyordu.
        run: eas update --channel production --platform all --environment production --non-interactive --message "OTA publish from macOS runner (fingerprint-safe)"
