name: iOS Production Build and Submit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ios-production-submit.yml
      - .github/ios-build-trigger

permissions:
  contents: read

concurrency:
  group: ios-production-build-submit
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build iOS and submit to App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production iOS and auto-submit
        run: eas build --platform ios --profile production --non-interactive --auto-submit --wait
