name: Apply startup boot fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-startup-boot-fix-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[startup-boot-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main helper
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve patch helper
        run: cp .github/scripts/fix-startup-boot.py /tmp/fix-startup-boot.py
      - name: Checkout UX branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1
          clean: true
      - name: Apply startup patch
        run: python /tmp/fix-startup-boot.py
      - name: Install dependencies
        run: npm ci
      - name: Validate all JS bundles
        run: npx expo export --platform all --output-dir /tmp/pellix-startup-boot
      - name: Commit UX changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add App.js src/context/AuthContext.js
          git commit -m "Make startup cache-first and remove second splash"
          git push origin HEAD:ux-retention-v1
