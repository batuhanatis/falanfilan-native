name: Check Production Build Environment
on:
  push:
    paths:
      - '.github/workflows/check-production-env.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup EAS CLI
        run: npm install -g eas-cli
      - name: Pull production env and check RevenueCat variable names without printing values
        shell: bash
        run: |
          set -e
          eas env:pull --environment production --non-interactive --path /tmp/pellix-production.env >/tmp/eas-pull-log 2>/tmp/eas-pull-error
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/pellix-production.env')
          text = p.read_text(errors='replace') if p.exists() else ''
          names = set()
          for raw in text.splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              names.add(line.split('=',1)[0].strip())
          for key in ['EXPO_PUBLIC_REVENUECAT_IOS_KEY','EXPO_PUBLIC_REVENUECAT_ANDROID_KEY']:
              print(f'{key}=' + ('PRESENT' if key in names else 'MISSING_OR_SECRET'))
          PY
          rm -f /tmp/pellix-production.env /tmp/eas-pull-log /tmp/eas-pull-error