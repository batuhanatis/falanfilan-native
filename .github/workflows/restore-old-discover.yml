name: Restore Old Discover
on:
  push:
    paths:
      - .github/workflows/restore-old-discover.yml
permissions:
  contents: write
jobs:
  restore-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore files
        run: |
          git show 57f2989e9aa14e7d1024fdc0cbae42450e847745:src/screens/DiscoverScreen.js > src/screens/DiscoverScreen.js
          git show 57f2989e9aa14e7d1024fdc0cbae42450e847745:src/context/PrefetchContext.js > src/context/PrefetchContext.js
          python .github/scripts/restore_old_discover.py
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir /tmp/pellix-old-discover-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir /tmp/pellix-old-discover-ios
      - name: Validate diff
        run: git diff --check
      - name: Commit restored Discover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-old-discover.yml .github/scripts/restore_old_discover.py
          git add src/screens/DiscoverScreen.js src/context/PrefetchContext.js .github/workflows/restore-old-discover.yml .github/scripts/restore_old_discover.py
          git commit -m "Keşfet sayfasını eski katalog akışına geri döndür"
          git push
