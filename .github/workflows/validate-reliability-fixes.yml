name: Validate reliability fixes
on:
  push:
    paths:
      - '.github/workflows/validate-reliability-fixes.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify API method references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const client = fs.readFileSync('src/api/client.js','utf8');
          const defined = new Set([...client.matchAll(/^\s{2}([A-Za-z_$][\w$]*):/gm)].map(m=>m[1]));
          const missing = new Set();
          function walk(dir){
            for (const entry of fs.readdirSync(dir,{withFileTypes:true})) {
              const p=path.join(dir,entry.name);
              if(entry.isDirectory()) walk(p);
              else if(/\.(js|jsx)$/.test(entry.name)) {
                let s=fs.readFileSync(p,'utf8');
                // URL içindeki "api.pellix.app" gibi stringler method çağrısı değildir.
                s = s.replace(/https?:\/\/[^\s"'`]+/g, '');
                for(const m of s.matchAll(/\bapi\.([A-Za-z_$][\w$]*)\s*\(/g)) if(!defined.has(m[1])) missing.add(m[1]);
              }
            }
          }
          walk('src');
          if(missing.size){ console.error('Missing api methods:', [...missing]); process.exit(1); }
          console.log('All api.* call references are defined.');
          NODE
      - name: Expo iOS bundle check
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform ios --output-dir /tmp/pellix-export
