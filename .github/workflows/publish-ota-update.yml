name: Publish OTA Update (production)

# ÖNEMLİ DÜZELTME: runtimeVersion policy'si "fingerprint" (app.json) — bir cihaz, SADECE
# kendi kurulu native build'iyle AYNI fingerprint'e sahip OTA'yı alır, aksi halde update
# sessizce hiç sunulmuyor. Fingerprint hesaplaması OS'a bağlı (özellikle CocoaPods/Xcode
# etkisiyle iOS'ta, ama Android'de de farklı çıkabiliyor) — eskiden TÜM platformlar TEK bir
# macOS job'ında `--platform all` ile yayınlanıyordu. Android production build'i
# (android-build-and-submit-temp.yml) ubuntu-latest'te alınıyor; macOS'ta hesaplanan Android
# fingerprint'i bununla EŞLEŞMİYORDU (doğrulandı: build'in gerçek fingerprint'i
# 947eb191d3afb3b2cbf3fdf445c2cf9243792126 iken macOS'ta publish edilen OTA'nın runtimeVersion'ı
# dc04c611fca015b4a202678ff81a6bb0a7ccfe3f çıktı — cihaz hiçbir zaman güncellemeyi görmedi).
# Artık her platform, o platformun production build'iyle AYNI OS'ta ayrı job'da publish ediliyor:
# Android → ubuntu-latest (android-build-and-submit-temp.yml ile aynı), iOS → macOS
# (ios-production-build.yml ile aynı).

on:
  push:
    branches: [main]
    paths:
      - '.github/ota-trigger'
      - '.github/workflows/publish-ota-update.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-android:
    name: Publish OTA update to production channel (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_BASE: https://api.pellix.app

    steps:
      - name: Checkout current production UX branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify production target
        run: |
          test "$EXPO_PUBLIC_API_BASE" = "https://api.pellix.app"
          node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync("eas.json","utf8")); if(e.build?.production?.channel!=="production") process.exit(1)'

      - name: Publish OTA update
        run: >-
          eas update --channel production --platform android --environment production --non-interactive
          --message "Production UX update from approved ux-retention-v1 branch"

  publish-ios:
    name: Publish OTA update to production channel (iOS)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_BASE: https://api.pellix.app

    steps:
      - name: Checkout current production UX branch
        uses: actions/checkout@v4
        with:
          ref: ux-retention-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify production target
        run: |
          test "$EXPO_PUBLIC_API_BASE" = "https://api.pellix.app"
          node -e 'const fs=require("fs"); const e=JSON.parse(fs.readFileSync("eas.json","utf8")); if(e.build?.production?.channel!=="production") process.exit(1)'

      - name: Publish OTA update
        run: >-
          eas update --channel production --platform ios --environment production --non-interactive
          --message "Production UX update from approved ux-retention-v1 branch"
