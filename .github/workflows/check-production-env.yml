name: Check Production Build Environment
on:
  push:
    paths:
      - '.github/workflows/check-production-env.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup EAS CLI
        run: npm install -g eas-cli
      - name: Check production RevenueCat variable names without printing values
        shell: bash
        run: |
          set -e
          eas env:list production --format long >/tmp/eas-env-list 2>/tmp/eas-env-error
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/eas-env-list').read_text(errors='replace')
          for key in ['EXPO_PUBLIC_REVENUECAT_IOS_KEY','EXPO_PUBLIC_REVENUECAT_ANDROID_KEY']:
              print(f'{key}=' + ('PRESENT' if key in text else 'MISSING'))
          PY
          rm -f /tmp/eas-env-list /tmp/eas-env-error