name: Social Product Reposition V2
on:
  push:
    paths:
      - '.github/workflows/social-product-reposition-v2.yml'
permissions:
  contents: write
jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply social product patch
        run: python .github/scripts/social_reposition_patch.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir dist-social-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir dist-social-ios
      - name: Commit social product architecture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf dist-social-android dist-social-ios
          rm -f .github/workflows/social-product-reposition-v2.yml
          rm -f .github/scripts/social_reposition_patch.py
          git add src .github
          git commit -m "Keşfi öneri motoruna taşı ve sosyal katmanı tamamla"
          git push origin HEAD:main
