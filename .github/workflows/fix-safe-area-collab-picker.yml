name: Fix Safe Area and Collaborator Picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-safe-area-collab-picker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply safe-area and collaborator picker fixes
        env:
          PATCH_B64: ""
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch_safe_area.py
          python /tmp/patch_safe_area.py
      - name: Install dependencies
        run: npm ci
      - name: Validate Android export
        run: npx expo export --platform android --output-dir dist-safe-area-android
      - name: Validate iOS export
        run: npx expo export --platform ios --output-dir dist-safe-area-ios
      - name: Commit fixes and cleanup workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-safe-area-collab-picker.yml .github/workflows/audit-safe-area.yml
          git add src/components/DismissableSheet.js src/components/ShareCardModal.js src/screens/OnboardingScreen.js src/components/TasteSurveyStep.js src/screens/WatchlistDetailScreen.js
          git commit -m "Android safe area ve ortak düzenleyici listesini düzelt"
          git push origin main
